function buildSequence(exercises, numCircuits) {
  const seq = [];
  for (let c = 0; c < numCircuits; c++)
    exercises.forEach((ex,i) => seq.push({ ...ex, circuit:c+1, slotInCircuit:i }));
  return seq;
}
const isEquipException = eq =>
  !eq || eq.toLowerCase()==="bodyweight" || eq.toLowerCase().includes("band");

function validateSharedKit(exercises, numPeople=2) {
  const issues = [];
  const n = exercises.length;
  for (let i = 0; i < n; i++) {
    const aEq = exercises[i].equipment||"";
    if (isEquipException(aEq)) continue;
    for (let w = 1; w < Math.min(numPeople, n); w++) {
      const b = exercises[(i+w)%n];
      const bEq = b.equipment||"";
      if (aEq===bEq)
        issues.push(`"${exercises[i].name}" and "${b.name}" both use ${aEq}`);
    }
  }
  return issues;
}

// ── Circuit optimiser ────────────────────────────────────────────────────────
// Rules applied in order:
// 1. No two adjacent exercises share the same "shared" equipment (kettlebell/medball)
// 2. No two adjacent exercises hit the same primary muscle group
// 3. Alternate upper/lower/core/cardio as much as possible
// 4. Place high-intensity (power/cardio) exercises away from each other
// 5. Start with compound movements, finish with core/mobility
function optimiseCircuit(exercises, numPeople=2) {
  if (exercises.length <= 1) return exercises;

  const MUSCLE_GROUP = (ex) => {
    const m = (ex.muscles||"").toLowerCase();
    if (m.includes("quad")||m.includes("glute")||m.includes("hamstring")||m.includes("lunge")||m.includes("squat")) return "lower";
    if (m.includes("chest")||m.includes("shoulder")||m.includes("tricep")||m.includes("bicep")||m.includes("back")||m.includes("row")) return "upper";
    if (m.includes("core")||m.includes("abs")||m.includes("oblique")||m.includes("plank")) return "core";
    return "cardio";
  };

  // Score a sequence — lower is better
  const score = (seq) => {
    let s = 0;
    const n = seq.length;
    for (let i = 0; i < n; i++) {
      const a = seq[i];
      const aEq = a.equipment||"";
      // Heavy penalty for equipment clash within the people-window
      if (!isEquipException(aEq)) {
        for (let w = 1; w < Math.min(numPeople, n); w++) {
          if (aEq===(seq[(i+w)%n].equipment||"")) s += 100;
        }
      }
      const b = seq[(i+1)%n];
      // Penalty for same muscle group back-to-back
      if (MUSCLE_GROUP(a) === MUSCLE_GROUP(b)) s += 20;
      // Penalty for two power/cardio back-to-back
      if ((a.type==="power"||a.type==="cardio") && (b.type==="power"||b.type==="cardio")) s += 10;
    }
    // Prefer core/mobility near end
    const last = seq[seq.length-1];
    if (last.type==="core"||last.type==="mobility") s -= 5;
    // Prefer compound strength/power near start
    const first = seq[0];
    if (first.type==="strength"||first.type==="power") s -= 3;
    return s;
  };

  // Random restarts (fast enough for ≤16 exercises)
  const shuffle = (arr) => [...arr].sort(()=>Math.random()-0.5);
  let best = [...exercises], bestScore = score(best);
  for (let attempt = 0; attempt < 200; attempt++) {
    const candidate = shuffle(exercises);
    const s = score(candidate);
    if (s < bestScore) { best = candidate; bestScore = s; }
  }

  // Final pass: force-swap any within-window equipment clashes that remain
  const result = [...best];
  for (let i = 0; i < result.length * 2; i++) {
    const idx = i % result.length;
    const aEq = result[idx].equipment||"";
    if (isEquipException(aEq)) continue;
    for (let w = 1; w < Math.min(numPeople, result.length); w++) {
      const next = (idx+w) % result.length;
      if ((result[next].equipment||"") === aEq) {
        // Swap `next` with the first position that doesn't clash with idx
        for (let j = 1; j < result.length; j++) {
          const swap = (next+j) % result.length;
          if (swap===idx) continue;
          if ((result[swap].equipment||"") !== aEq) {
            [result[next], result[swap]] = [result[swap], result[next]];
            break;
          }
        }
      }
    }
  }
  return result;
}

  page:   { minHeight:"100vh", background:"#0d0f12", color:"#e8eaed", fontFamily:"'DM Mono','Courier New',monospace", display:"flex", flexDirection:"column", alignItems:"center", padding:"24px 20px 56px", boxSizing:"border-box" },
  label:  { fontSize:12, letterSpacing:"0.16em", color:"#a0aec0", textTransform:"uppercase", marginBottom:10, fontWeight:600 },
  h1:     { fontSize:32, fontWeight:700, fontFamily:"Georgia,serif", lineHeight:1.1, color:"#f7fafc", marginBottom:24 },
  card:   { background:"#1a2035", border:"1px solid #2d3a50", borderRadius:12, padding:"18px" },
  btnPri: { width:"100%", padding:"16px", borderRadius:10, border:"none", background:"#4ade80", color:"#042008", fontSize:14, fontWeight:700, letterSpacing:"0.12em", fontFamily:"'DM Mono',monospace", cursor:"pointer", textTransform:"uppercase" },
  btnSec: { background:"transparent", color:"#a0aec0", border:"1px solid #2d3a50", borderRadius:8, padding:"11px 18px", fontSize:12, fontFamily:"'DM Mono',monospace", letterSpacing:"0.1em", cursor:"pointer", textTransform:"uppercase" },
  seg:    (on, col) => ({ flex:1, height:48, borderRadius:8, background:on?(col||"#f7fafc"):"#1a2035", color:on?"#042008":"#a0aec0", border:on?"none":"1px solid #2d3a50", fontSize:17, fontWeight:700, fontFamily:"'DM Mono',monospace", cursor:"pointer" }),
};

// ─────────────────────────────────────────────────────────────────────────────
function CircuitTrainer() {
  const [screen,       setScreen]       = useState("setup");
  const normaliseBands = exArr => exArr.map(e => {
    const eq = e.equipment || "";
    const isBand = /band/i.test(eq) && eq.toLowerCase() !== "bands";
    return isBand ? {...e, equipment:"Bands"} : e;
  });
  const [db,           setDb]           = useState(() => {
    try {
      const s = localStorage.getItem("ct_exercise_db");
      if (s) { const p=JSON.parse(s); if (Array.isArray(p)&&p.length>0) return normaliseBands(p); }
    } catch {}
    return INITIAL_DB;
  });
  const [numCircuits,  setNumCircuits]  = useState(2);
  const [numPeople,    setNumPeople]    = useState(2);
  const [numExercises, setNumExercises] = useState(10);
  const [names,        setNames]        = useState(() => pickAnimalNames(4));
  const [workSec,      setWorkSec]      = useState(45);
  const [restSec,      setRestSec]      = useState(15);
  const [chosen,       setChosen]       = useState(() => DEFAULT_IDS.map(id=>INITIAL_DB.find(e=>e.id===id)));
  const [phase,        setPhase]        = useState("work");
  const [masterIdx,    setMasterIdx]    = useState(0);
  const [timeLeft,     setTimeLeft]     = useState(45);
  const [countdownSec, setCountdownSec] = useState(30);
  const [elapsed,      setElapsed]      = useState(0);
  const [focusPerson,  setFocusPerson]  = useState(null);
  const [paused,       setPaused]       = useState(false);
  const [reviewFilter, setReviewFilter] = useState("all");
  const [reviewSearch, setReviewSearch] = useState("");
  const [optimised,    setOptimised]    = useState(false);
  const [dragIdx,      setDragIdx]      = useState(null);
  const [dragOverIdx,  setDragOverIdx]  = useState(null);
  const [showUnavail,  setShowUnavail]  = useState(false);
  const [isFullscreen, setIsFullscreen] = useState(false);
  const [availEquip,   setAvailEquip]   = useState(() => {
    try {
      const s = localStorage.getItem("ct_avail_equip");
      if (s) {
        const parsed = JSON.parse(s);
        // Migrate old group-id format to item-id format
        const isOldFormat = parsed.some(id => ["kettlebell","medball","bands","gliders"].includes(id));
        if (!isOldFormat) return new Set(parsed);
      }
    } catch {}
    return new Set(INITIAL_EQUIP_DB.filter(e=>!e.alwaysAvail).map(e=>e.id));
  });
  const [equipDb, setEquipDb] = useState(() => {
    try { const s=localStorage.getItem("ct_equip_db"); return s?JSON.parse(s):INITIAL_EQUIP_DB; }
    catch { return INITIAL_EQUIP_DB; }
  });
  const [previewPopup,  setPreviewPopup]  = useState(null);  // exercise object or null
  const [showQuickAdd,  setShowQuickAdd]  = useState(false);
  const [quickForm,     setQuickForm]     = useState({name:"", type:"strength", equipment:"Bodyweight", muscles:"", cues:""});

  // ── Timed setup mode ──────────────────────────────────────────────────
  const [setupMode,     setSetupMode]     = useState("timed"); // "timed" | "manual"
  const [timedMins,     setTimedMins]     = useState(45);
  const [showCustomMin, setShowCustomMin] = useState(false);
  const [customMinStr,  setCustomMinStr]  = useState("");

  const timerRef       = useRef(null);
  const seqRef         = useRef([]);
  const audioRef       = useRef(null);
  const spokenRef      = useRef(new Set());
  const previewRowsRef = useRef([]);
  const voiceRef       = useRef(null);

  // Persist exercises — localStorage for instant load, Firebase for cross-device sync
  useEffect(() => {
    localStorage.setItem("ct_exercise_db", JSON.stringify(db));
    fbWrite("exercises", db);
  }, [db]);
  // Persist available equipment selection — device-local only (per-session/per-gym-station)
  useEffect(() => {
    localStorage.setItem("ct_avail_equip", JSON.stringify([...availEquip]));
  }, [availEquip]);
  // Persist equipment DB — localStorage + Firebase
  useEffect(() => {
    localStorage.setItem("ct_equip_db", JSON.stringify(equipDb));
    fbWrite("equipment", equipDb);
  }, [equipDb]);
  // On mount: load authoritative data from Firebase, overriding local cache
  useEffect(() => {
    fbRead("exercises").then(data => {
      if (Array.isArray(data) && data.length > 0) setDb(normaliseBands(data));
    });
    fbRead("equipment").then(data => {
      if (Array.isArray(data) && data.length > 0) setEquipDb(data);
    });
  }, []);

  function toggleEquip(id) {
    setAvailEquip(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  }

  useEffect(() => {
    const onChange = () => setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange", onChange);
    return () => document.removeEventListener("fullscreenchange", onChange);
  }, []);

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  }

  const handleSwap = (drag, targetIndex) => {
    setChosen(prev => {
      const nc = [...prev];
      if (drag.source==="chosen") { const [m]=nc.splice(drag.index,1); nc.splice(targetIndex,0,m); }
      else nc[targetIndex] = db[drag.index];
      return nc;
    });
  };
  // dragState kept as empty stub — drag UI replaced by checklist
  const dragging = null;
  const dragOver = null;

  // ── Timed-mode derived values ─────────────────────────────────────────
  const TIMED_WORK     = 45;
  const TIMED_REST     = 20;
  const timedCircuits  = timedMins <= 30 ? 2 : 3;
  const timedExercises = Math.ceil(timedMins * 60 / ((TIMED_WORK + TIMED_REST) * timedCircuits));

  // Active values — gate between timed and manual throughout the component
  const activeWorkSec   = setupMode === "timed" ? TIMED_WORK     : workSec;
  const activeRestSec   = setupMode === "timed" ? TIMED_REST     : restSec;
  const activeCircuits  = setupMode === "timed" ? timedCircuits  : numCircuits;
  const activeExercises = setupMode === "timed" ? timedExercises : numExercises;

  // When activeExercises changes, trim or extend chosen list
  useEffect(() => {
    setChosen(prev => {
      const updated = prev.map(c => db.find(e=>e.id===c.id)).filter(Boolean);
      if (updated.length > activeExercises) return updated.slice(0, activeExercises);
      if (updated.length < activeExercises) {
        const ids = new Set(updated.map(e=>e.id));
        const pool = db.filter(e=>isExAvail(e, availEquip, equipDb) && !ids.has(e.id));
        const fill = pool.length ? pool : db.filter(e=>!ids.has(e.id));
        return [...updated, ...fill.slice(0, activeExercises - updated.length)];
      }
      return updated;
    });
  }, [activeExercises, db]);

  const seq        = seqRef.current;
  const coreLen    = seq.length;
  const totalSlots = Math.max(coreLen + numPeople - 1, coreLen);
  const totalTime  = totalSlots * (activeWorkSec+activeRestSec);
  const progPct    = Math.min((elapsed/Math.max(totalTime,1))*100, 100);
  const mm         = Math.floor(elapsed/60).toString().padStart(2,"0");
  const ss         = (elapsed%60).toString().padStart(2,"0");
  const isResting  = phase==="rest";
  const masterSlot = seq[masterIdx];
  const mType      = masterSlot ? (TYPE_COLORS[masterSlot.type]||TYPE_COLORS.strength) : TYPE_COLORS.strength;
  const circ       = 2*Math.PI*54;
  const tMax       = isResting ? activeRestSec : activeWorkSec;
  const isCD       = !isResting && timeLeft<=10;
  const ringColor  = paused?"#3a4a5a":isResting?"#4ade80":isCD?"#f87171":mType.accent;
  const dash       = circ - (timeLeft/Math.max(tMax,1))*circ;

  // ── Voice selection ───────────────────────────────────────────────────
  const loadVoice = () => {
    const voices = window.speechSynthesis.getVoices();
    if (!voices.length) return;
    // Priority ladder — most natural female first, then fallbacks
    const tests = [
      v => v.name === "Samantha",                                                          // iOS — warm, natural
      v => v.lang.startsWith("en") && /female/i.test(v.name),                            // Chrome Android "Google UK English Female"
      v => v.lang.startsWith("en") && /\b(Aria|Jenny|Sara|Zira|Emma|Emily|Susan)\b/i.test(v.name), // Edge Natural
      v => v.lang.startsWith("en") && /\b(Karen|Moira|Tessa|Fiona|Veena|Victoria)\b/i.test(v.name),
      v => v.lang.startsWith("en-GB") && v.localService,
      v => v.lang.startsWith("en") && v.localService,
      v => v.lang.startsWith("en"),
    ];
    for (const test of tests) {
      const match = voices.find(test);
      if (match) { voiceRef.current = match; return; }
    }
    voiceRef.current = voices[0];
  };
  useEffect(() => {
    loadVoice();
    window.speechSynthesis.onvoiceschanged = loadVoice;
    return () => { try { window.speechSynthesis.onvoiceschanged = null; } catch(e){} };
  }, []);

  // ── Audio ─────────────────────────────────────────────────────────────
  const initAudio = () => {
    try {
      if (!audioRef.current) audioRef.current = new (window.AudioContext||window.webkitAudioContext)();
      if (audioRef.current.state==="suspended") audioRef.current.resume();
      const p=new SpeechSynthesisUtterance(" "); p.volume=0; window.speechSynthesis.speak(p);
    } catch(e){}
  };
  const beep = (freq=880,dur=0.12,vol=0.45,delay=0) => {
    try {
      const ctx=audioRef.current; if(!ctx||ctx.state!=="running") return;
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=freq; o.type="sine";
      const t=ctx.currentTime+delay;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.01); g.gain.linearRampToValueAtTime(0,t+dur);
      o.start(t); o.stop(t+dur+0.05);
    } catch(e){}
  };
  const speak = (text, rate=1.1) => {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voiceRef.current) u.voice = voiceRef.current;
      u.rate = rate; u.volume = 1.0; u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    } catch(e) {}
  };
  const playStart = () => { beep(880,0.15,0.6); beep(1320,0.22,0.6,0.18); };

  useEffect(() => {
    if (screen!=="active"||paused) return;
    if (phase==="work"&&timeLeft<=10&&timeLeft>0) {
      if (!spokenRef.current.has(timeLeft)) {
        spokenRef.current.add(timeLeft);
        if (timeLeft===1) { beep(1100,0.3,0.6); speak("Go!",1.2); }
        else speak(String(timeLeft),1.15);
      }
    }
    if (phase==="rest"&&timeLeft===5) speak("Get ready",1.0);
  }, [timeLeft, phase, screen, paused]);

  useEffect(() => {
    if (phase==="work") spokenRef.current=new Set();
    if (screen==="active"&&phase==="work"&&!paused) { playStart(); speak("Go!", 1.2); }
  }, [phase, masterIdx]);

  const stopTimer = () => { if (timerRef.current) clearInterval(timerRef.current); };
  useEffect(() => {
    if (screen==="active"&&!paused) {
      timerRef.current = setInterval(()=>{ setTimeLeft(t=>t<=1?0:t-1); setElapsed(e=>e+1); },1000);
      return stopTimer;
    }
  }, [screen, phase, masterIdx, paused]);

  useEffect(() => {
    if (timeLeft!==0) return;
    stopTimer();
    if (phase==="work") {
      if (masterIdx+1>=totalSlots) setScreen("done");
      else { setMasterIdx(i=>i+1); setTimeLeft(activeRestSec); setPhase("rest"); }
    } else { setTimeLeft(activeWorkSec); setPhase("work"); }
  }, [timeLeft]);

  // ── Pre-session countdown ─────────────────────────────────────────────
  useEffect(() => {
    if (screen !== "countdown") return;
    if (countdownSec <= 0) {
      setScreen("active");
      return;
    }
    // Speak last 10 seconds
    if (countdownSec <= 10) {
      if (countdownSec === 3) { speak("Three", 1.1); }
      else if (countdownSec === 2) { speak("Two", 1.1); }
      else if (countdownSec === 1) { speak("One", 1.1); }
      else { speak(String(countdownSec), 1.1); }
    }
    if (countdownSec === 10) speak("Ten seconds", 1.0);
    const t = setTimeout(() => setCountdownSec(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [screen, countdownSec]);

  const startSession = () => {
    initAudio();
    seqRef.current = buildSequence(chosen, activeCircuits);
    setMasterIdx(numPeople - 1); setElapsed(0); setTimeLeft(activeWorkSec);
    setPhase("work"); setFocusPerson(null); setPaused(false);
    setCountdownSec(30);
    setScreen("countdown");
  };
  const goHome = () => {
    stopTimer(); seqRef.current=[];
    setScreen("setup"); setMasterIdx(0); setTimeLeft(activeWorkSec);
    setElapsed(0); setPhase("work"); setFocusPerson(null); setPaused(false);
    setCountdownSec(30);
  };
  const kitIssues = validateSharedKit(chosen, numPeople);
  const libAvail  = db.filter(ex=>!chosen.find(c=>c.id===ex.id));
  const estMins   = Math.round(activeCircuits*chosen.length*(activeWorkSec+activeRestSec)/60);

  if (screen==="admin") return <AdminScreen db={db} setDb={setDb} onBack={()=>setScreen("setup")} initAudio={initAudio} beep={beep} availEquip={availEquip} toggleEquip={toggleEquip} equipDb={equipDb} setEquipDb={setEquipDb}/>;

  // ── SETUP ────────────────────────────────────────────────────────────
  if (screen==="setup") return (
    <div style={S.page}>
      <div style={{width:"100%", maxWidth:600}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:32}}>
          <div style={{fontSize:13, letterSpacing:"0.2em", color:"#718096", fontWeight:600}}>CIRCUIT TRAINING</div>
          <div style={{display:"flex", gap:8}}>
            <button onClick={toggleFullscreen} style={{...S.btnSec, padding:"8px 11px", fontSize:14, letterSpacing:0}} title={isFullscreen?"Exit fullscreen":"Fullscreen"}>
              {isFullscreen ? "⊡" : "⛶"}
            </button>
            <button onClick={()=>setScreen("admin")} style={{...S.btnSec, padding:"8px 14px", fontSize:11}}>⚙ ADMIN</button>
          </div>
        </div>
        <div style={S.h1}>Set up<br/>your session</div>

        {/* ── Mode tab switcher ── */}
        <div style={{display:"flex", gap:0, background:"#111520", borderRadius:10, padding:3, marginBottom:28}}>
          {[["timed","⏱  Timed"],["manual","⚙  Manual"]].map(([mode,label])=>(
            <button key={mode} onClick={()=>setSetupMode(mode)} style={{
              flex:1, padding:"10px", borderRadius:8, border:"none",
              background: setupMode===mode ? "#1a2035" : "transparent",
              color: setupMode===mode ? "#f7fafc" : "#4a5568",
              fontSize:12, fontWeight:700, fontFamily:"'DM Mono',monospace",
              letterSpacing:"0.12em", cursor:"pointer", textTransform:"uppercase",
              transition:"background 0.2s, color 0.2s"
            }}>{label}</button>
          ))}
        </div>

        {/* ── TIMED: duration picker ── */}
        {setupMode==="timed" && (
          <div style={{marginBottom:28}}>
            <div style={S.label}>Session Duration</div>
            <div style={{display:"flex", gap:10, marginBottom: showCustomMin ? 10 : 0}}>
              {[20,30,45].map(m=>(
                <button key={m}
                  onClick={()=>{ setTimedMins(m); setShowCustomMin(false); }}
                  style={S.seg(!showCustomMin && timedMins===m)}>
                  {m}m
                </button>
              ))}
              <button onClick={()=>setShowCustomMin(true)} style={S.seg(showCustomMin)}>custom</button>
            </div>
            {showCustomMin && (
              <input type="number" min={10} max={60} value={customMinStr} placeholder="10 – 60 min"
                onChange={e=>{
                  setCustomMinStr(e.target.value);
                  const v=parseInt(e.target.value,10);
                  if(!isNaN(v)) setTimedMins(Math.min(60,Math.max(10,v)));
                }}
                style={{width:"100%", background:"#111825", border:"1px solid #2d3a50", borderRadius:10,
                  padding:"12px 14px", color:"#e8eaed", fontSize:13, marginBottom:10,
                  fontFamily:"'DM Mono',monospace", outline:"none", boxSizing:"border-box", textAlign:"center"}}/>
            )}
            <div style={{marginTop:showCustomMin?0:10, background:"#111520", border:"1px solid #2d3a50",
              borderRadius:10, padding:"12px 16px", display:"flex", gap:8, flexWrap:"wrap"}}>
              {[
                [`${TIMED_WORK}s work`,"#4ade80"],
                [`${TIMED_REST}s rest`,"#60a5fa"],
                [`${timedCircuits} circuit${timedCircuits>1?"s":""}`,"#c084fc"],
                [`${timedExercises} exercises`,"#f7fafc"],
              ].map(([lbl,col])=>(
                <span key={lbl} style={{fontSize:11, fontWeight:700, color:col,
                  background:`${col}18`, padding:"4px 10px", borderRadius:20,
                  letterSpacing:"0.06em"}}>{lbl}</span>
              ))}
            </div>
          </div>
        )}

        {/* ── MANUAL: circuits + timing sliders ── */}
        {setupMode==="manual" && (
          <>
            <div style={{marginBottom:28}}>
              <div style={S.label}>Circuits</div>
              <div style={{display:"flex", gap:10}}>{[1,2,3,4].map(n=><button key={n} onClick={()=>setNumCircuits(n)} style={S.seg(numCircuits===n)}>{n}</button>)}</div>
            </div>
            <div style={{marginBottom:28}}>
              <div style={S.label}>Interval Timing</div>
              <div style={{...S.card, display:"flex", flexDirection:"column", gap:24}}>
                <Slider label="Work" value={workSec} min={20} max={240} step={5} onChange={setWorkSec} accent="#4ade80"/>
                <Slider label="Rest" value={restSec} min={10} max={45}  step={5} onChange={setRestSec} accent="#60a5fa"/>
              </div>
            </div>
          </>
        )}

        <div style={{marginBottom:28}}>
          <div style={S.label}>People</div>
          <div style={{display:"flex", gap:10}}>{[1,2,3,4].map(n=><button key={n} onClick={()=>setNumPeople(n)} style={S.seg(numPeople===n, "#4ade80")}>{n}</button>)}</div>
        </div>

        <div style={{marginBottom:28}}>
          <div style={S.label}>Names (optional)</div>
          <div style={{display:"grid", gridTemplateColumns:numPeople>2?"1fr 1fr":"1fr", gap:10}}>
            {Array.from({length:numPeople},(_,i)=>(
              <div key={i} style={{display:"flex", alignItems:"center", gap:10, background:"#1a2035", border:"1px solid #2d3a50", borderRadius:10, padding:"11px 14px"}}>
                <div style={{width:22, height:22, borderRadius:6, background:PERSON_COLORS[i], display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:700, color:"#042008", flexShrink:0}}>{i+1}</div>
                <input value={names[i]} onChange={e=>{const n=[...names];n[i]=e.target.value;setNames(n);}} maxLength={10}
                  placeholder={`Person ${i+1}`}
                  style={{background:"transparent", border:"none", outline:"none", color:"#e8eaed", fontSize:14, fontFamily:"'DM Mono',monospace", width:"100%"}}/>
              </div>
            ))}
          </div>
        </div>

        <div style={{marginBottom:28}}>
          <div style={S.label}>Equipment</div>
          <div style={{display:"flex", flexDirection:"column", gap:6}}>
            {equipDb.filter(e=>!e.alwaysAvail).map(item => {
              const on = availEquip.has(item.id);
              return (
                <button key={item.id} onClick={()=>toggleEquip(item.id)} style={{
                  display:"flex", alignItems:"center", gap:12,
                  padding:"10px 14px", borderRadius:10,
                  background: on ? "#0a2a1a" : "#111520",
                  border: `1px solid ${on ? "#4ade8055" : "#2d3a50"}`,
                  cursor:"pointer", textAlign:"left"
                }}>
                  <div style={{width:20, height:20, borderRadius:5, background: on?"#4ade80":"transparent", border:`2px solid ${on?"#4ade80":"#3d4a60"}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:700, color:"#042008", flexShrink:0}}>{on?"✓":""}</div>
                  <div style={{fontSize:12, fontWeight:700, color: on?"#4ade80":"#4a5568", flex:1}}>{item.label}</div>
                  {item.sharedGroup && <div style={{fontSize:10, color:"#4a5568", letterSpacing:"0.08em"}}>shared</div>}
                </button>
              );
            })}
          </div>
          <div style={{fontSize:11, color:"#4a5568", marginTop:8}}>Bodyweight always included. Add equipment in ⚙ Admin → Equipment.</div>
        </div>

        <div style={{...S.card, marginBottom:28, lineHeight:2.1}}>
          {[
            ["Exercises", setupMode==="timed" ? `${timedExercises} per circuit` : `${chosen.length} selected`],
            ["Work / Rest", `${fmtSec(activeWorkSec)} on · ${fmtSec(activeRestSec)} rest`],
            ["Circuits", `${activeCircuits}×`],
            ["Est. Duration", `~${estMins} min`],
            numPeople>1 && ["Stagger", "1 exercise offset per person"],
          ].filter(Boolean).map(([k,v])=>(
            <div key={k} style={{display:"flex", justifyContent:"space-between", fontSize:13}}>
              <span style={{color:"#718096"}}>{k}</span>
              <span style={{color:"#e2e8f0", fontWeight:600}}>{v}</span>
            </div>
          ))}
        </div>

        <button onClick={()=>setScreen("review")} style={S.btnPri}>Review Exercises →</button>
      </div>
    </div>
  );

  // ── REVIEW ───────────────────────────────────────────────────────────
  if (screen==="review") {
    const selectedIds = new Set(chosen.map(e=>e.id));

    const toggleEx = (ex) => {
      setOptimised(false);
      if (selectedIds.has(ex.id)) {
        if (chosen.length > 1) setChosen(prev=>prev.filter(e=>e.id!==ex.id));
      } else {
        setChosen(prev=>[...prev, ex]);
      }
    };

    const handleOptimise = () => {
      setChosen(prev=>optimiseCircuit(prev, numPeople));
      setOptimised(true);
    };

    const visibleDb = db.filter(ex => {
      if (!showUnavail && !isExAvail(ex, availEquip, equipDb)) return false;
      if (reviewFilter!=="all" && ex.type!==reviewFilter) return false;
      if (reviewSearch && !ex.name.toLowerCase().includes(reviewSearch.toLowerCase()) && !ex.equipment.toLowerCase().includes(reviewSearch.toLowerCase())) return false;
      return true;
    });

    const kitIssues = validateSharedKit(chosen, numPeople);

    return (
      <div style={{...S.page, paddingBottom:90}}>
        <div style={{width:"100%", maxWidth:600}}>

          {/* Header */}
          <div style={{display:"flex", alignItems:"center", gap:14, marginBottom:6}}>
            <button onClick={()=>setScreen("setup")} style={S.btnSec}>← Back</button>
          </div>

          {/* Big title */}
          <div style={{fontSize:34, fontWeight:700, fontFamily:"Georgia,serif", color:"#f7fafc", lineHeight:1.1, marginBottom:20}}>Select your<br/>exercises</div>

          {/* Search + Add button row */}
          <div style={{display:"flex", gap:8, marginBottom:10}}>
            <input value={reviewSearch} onChange={e=>setReviewSearch(e.target.value)} placeholder="Search exercises…"
              style={{flex:1, background:"#1a2035", border:"1px solid #2d3a50", borderRadius:10, padding:"11px 14px", color:"#e8eaed", fontSize:13, fontFamily:"'DM Mono',monospace", outline:"none", boxSizing:"border-box"}}/>
            <button onClick={()=>{ setShowQuickAdd(true); }}
              style={{background:"#0a2a1a", border:"1px solid #4ade8044", borderRadius:10, padding:"10px 14px", color:"#4ade80", fontSize:12, fontWeight:700, fontFamily:"'DM Mono',monospace", cursor:"pointer", whiteSpace:"nowrap", flexShrink:0}}>
              + New
            </button>
          </div>

          {/* Type filter dropdown + show unavailable toggle */}
          <div style={{display:"flex", gap:8, marginBottom:16, alignItems:"center"}}>
            <select value={reviewFilter} onChange={e=>setReviewFilter(e.target.value)}
              style={{flex:1, background:"#1a2035", border:"1px solid #2d3a50", borderRadius:10,
                padding:"9px 12px", color:"#e8eaed", fontSize:12, fontFamily:"'DM Mono',monospace",
                outline:"none", letterSpacing:"0.06em", cursor:"pointer"}}>
              <option value="all">All types</option>
              {TYPE_OPTIONS.map(t=><option key={t} value={t}>{t.charAt(0).toUpperCase()+t.slice(1)}</option>)}
            </select>
            <button onClick={()=>setShowUnavail(s=>!s)} style={{
              padding:"9px 12px", borderRadius:10, fontSize:11, flexShrink:0,
              background: showUnavail ? "#f8717120" : "#1a2035",
              color: showUnavail ? "#f87171" : "#4a5568",
              border: showUnavail ? "1px solid #f8717144" : "1px solid #2d3a50",
              fontFamily:"'DM Mono',monospace", letterSpacing:"0.07em", fontWeight:600, cursor:"pointer"
            }}>{showUnavail ? "✕ Unavail" : "Show unavail"}</button>
          </div>

          {/* Full exercise library */}
          <div style={{display:"flex", flexDirection:"column", gap:6, marginBottom:24}}>
            {visibleDb.map(ex=>{
              const tc=TYPE_COLORS[ex.type]||TYPE_COLORS.strength;
              const isSelected=selectedIds.has(ex.id);
              const avail=isExAvail(ex, availEquip, equipDb);
              const exItem=getExEquipItem(ex, equipDb);
              return (
                <button key={ex.id} onClick={()=>toggleEx(ex)}
                  style={{display:"flex", alignItems:"center", gap:12, background:isSelected?"#111a10":"#111520", border:`1px solid ${isSelected?"#2d4a35":"#1e2a3a"}`, borderRadius:10, padding:"12px 14px", cursor:"pointer", textAlign:"left", width:"100%", opacity:avail?1:0.45}}>
                  <div style={{width:24, height:24, borderRadius:6, border:`2px solid ${isSelected?"#4ade80":"#3d4a60"}`, background:isSelected?"#4ade80":"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontSize:14, fontWeight:700, color:"#042008", transition:"all 0.15s"}}>
                    {isSelected?"✓":""}
                  </div>
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{fontSize:14, fontWeight:600, color:isSelected?"#8ab89a":"#f0f4f8", marginBottom:4, lineHeight:1.3}}>{ex.name}</div>
                    <div style={{display:"flex", gap:6, flexWrap:"wrap", alignItems:"center"}}>
                      <span style={{fontSize:10, color:tc.accent, background:`${tc.accent}22`, padding:"2px 7px", borderRadius:4, letterSpacing:"0.08em", fontWeight:700}}>{tc.label}</span>
                      <span style={{fontSize:11, color:"#8a9bb0"}}>{ex.equipment}</span>
                      {!avail&&(
                        <span style={{fontSize:9, color:"#f87171", background:"#f8717120", padding:"2px 6px", borderRadius:3, fontWeight:600}}>⊘ {exItem?.label||ex.equipment}</span>
                      )}
                    </div>
                  </div>
                </button>
              );
            })}
          </div>

          {/* Quick-add exercise form */}
          {showQuickAdd && (
            <div style={{background:"#111825", border:"1px solid #2d4a35", borderRadius:12, padding:"16px", marginBottom:16}}>
              <div style={{fontSize:11, letterSpacing:"0.16em", color:"#4ade80", fontWeight:600, marginBottom:12}}>NEW EXERCISE</div>
              <input
                value={quickForm.name}
                onChange={e=>setQuickForm(f=>({...f, name:e.target.value}))}
                placeholder="Exercise name *"
                autoFocus
                style={{width:"100%", background:"#0d0f12", border:"1px solid #2d3a50", borderRadius:8,
                  padding:"10px 12px", color:"#e8eaed", fontSize:13, fontFamily:"'DM Mono',monospace",
                  outline:"none", boxSizing:"border-box", marginBottom:8}}
              />
              <div style={{display:"flex", gap:8, marginBottom:10}}>
                <select
                  value={quickForm.type}
                  onChange={e=>setQuickForm(f=>({...f, type:e.target.value}))}
                  style={{flex:1, background:"#0d0f12", border:"1px solid #2d3a50", borderRadius:8,
                    padding:"10px 10px", color:"#e8eaed", fontSize:12, fontFamily:"'DM Mono',monospace", outline:"none"}}>
                  {TYPE_OPTIONS.map(t=><option key={t} value={t}>{t}</option>)}
                </select>
                <select
                  value={quickForm.equipment}
                  onChange={e=>setQuickForm(f=>({...f, equipment:e.target.value}))}
                  style={{flex:2, background:"#0d0f12", border:"1px solid #2d3a50", borderRadius:8,
                    padding:"10px 10px", color:"#e8eaed", fontSize:12, fontFamily:"'DM Mono',monospace", outline:"none"}}>
                  {equipDb.map(eq=><option key={eq.id} value={eq.label}>{eq.label}</option>)}
                </select>
              </div>
              <div style={{display:"flex", gap:8}}>
                <button
                  onClick={()=>{ setShowQuickAdd(false); setQuickForm({name:"", type:"strength", equipment:"Bodyweight", muscles:"", cues:""}); }}
                  style={{...S.btnSec, flex:1, textAlign:"center", fontSize:12, padding:"10px"}}>
                  Cancel
                </button>
                <button
                  disabled={!quickForm.name.trim()}
                  onClick={()=>{
                    if (!quickForm.name.trim()) return;
                    const newEx = { ...quickForm, id: Date.now().toString(36), gif:"", shared:null };
                    setDb(prev => [...prev, newEx]);
                    setChosen(prev => [...prev, newEx]);
                    setShowQuickAdd(false);
                    setQuickForm({name:"", type:"strength", equipment:"Bodyweight", muscles:"", cues:""});
                  }}
                  style={{flex:2, background:quickForm.name.trim()?"#4ade80":"#1e2a3a",
                    color:quickForm.name.trim()?"#042008":"#4a5568", border:"none", borderRadius:8,
                    fontSize:12, fontWeight:700, padding:"10px", fontFamily:"'DM Mono',monospace",
                    cursor:quickForm.name.trim()?"pointer":"not-allowed", letterSpacing:"0.08em"}}>
                  + Add &amp; Select
                </button>
              </div>
            </div>
          )}

          {/* Test audio */}
          <button onClick={()=>{
            try {
              if (!audioRef.current) audioRef.current = new (window.AudioContext||window.webkitAudioContext)();
              if (audioRef.current.state==="suspended") audioRef.current.resume();
              const p=new SpeechSynthesisUtterance(" "); p.volume=0; window.speechSynthesis.speak(p);
            } catch(e){}
            beep(880,0.15,0.6,0); beep(1320,0.22,0.6,0.2);
          }} style={{...S.btnSec, width:"100%", textAlign:"center"}}>
            🔊 Test Audio
          </button>
        </div>

        {/* Floating selected counter */}
        <div style={{position:"fixed", top:16, right:16, zIndex:50, background:"#4ade80", color:"#042008", borderRadius:20, padding:"6px 14px", fontSize:13, fontWeight:700, fontFamily:"'DM Mono',monospace", boxShadow:"0 4px 16px rgba(0,0,0,0.4)", pointerEvents:"none"}}>
          {chosen.length} selected
        </div>

        {/* Persistent Next button — optimises then advances */}
        <div style={{position:"fixed", bottom:0, right:0, padding:"14px 20px 28px", zIndex:10}}>
          <button
            onClick={()=>{ setChosen(prev=>optimiseCircuit(prev, numPeople)); setOptimised(true); setScreen("preview"); }}
            disabled={chosen.length===0}
            style={{background:chosen.length===0?"#1a2035":"#4ade80", color:chosen.length===0?"#4a5568":"#042008",
              border:"none", borderRadius:14, fontSize:15, fontWeight:700, padding:"16px 28px",
              fontFamily:"'DM Mono',monospace", letterSpacing:"0.1em", cursor:chosen.length===0?"not-allowed":"pointer",
              boxShadow:"0 4px 20px rgba(0,0,0,0.5)", textTransform:"uppercase"}}>
            Next →
          </button>
        </div>
      </div>
    );
  }

  // ── PREVIEW & START ──────────────────────────────────────────────────
  if (screen==="preview") return (
    <div style={{...S.page, paddingBottom:100}}>
      <div style={{width:"100%", maxWidth:700}}>

        {/* Header */}
        <div style={{display:"flex", alignItems:"center", gap:14, marginBottom:16}}>
          <button onClick={()=>setScreen("review")} style={S.btnSec}>← Back</button>
        </div>
        <div style={{fontSize:34, fontWeight:700, fontFamily:"Georgia,serif", color:"#f7fafc",
          lineHeight:1.1, marginBottom:20}}>
          Review &amp;<br/>Start
        </div>

        {/* Session summary pill bar */}
        <div style={{display:"flex", gap:8, flexWrap:"wrap", marginBottom:20}}>
          {[
            [`${fmtSec(activeWorkSec)} work`, "#4ade80"],
            [`${fmtSec(activeRestSec)} rest`, "#60a5fa"],
            [`${activeCircuits} circuit${activeCircuits>1?"s":""}`, "#c084fc"],
            [`${chosen.length} exercises`, "#f7fafc"],
            [`~${estMins} min`, "#fb923c"],
          ].map(([lbl,col])=>(
            <span key={lbl} style={{fontSize:12, fontWeight:700, color:col, background:`${col}18`,
              padding:"5px 12px", borderRadius:20, letterSpacing:"0.06em"}}>{lbl}</span>
          ))}
        </div>

        {/* Equipment needed */}
        <div style={{...S.card, marginBottom:20}}>
          <div style={{fontSize:11, color:"#718096", letterSpacing:"0.14em", fontWeight:600, marginBottom:10}}>EQUIPMENT NEEDED</div>
          {[...new Set(chosen.map(e=>e.equipment))].map(eq=>{
            const item = equipDb.find(e=>e.label===eq);
            const missing = item && !item.alwaysAvail && !availEquip.has(item.id);
            return (
              <div key={eq} style={{display:"flex", alignItems:"center", gap:8, marginBottom:6}}>
                <div style={{width:7, height:7, borderRadius:"50%", flexShrink:0, background:"#4a5568"}}/>
                <span style={{fontSize:12, color: missing?"#fb923c":"#c8d4e0"}}>{eq}</span>
                {missing&&<span style={{fontSize:9, color:"#fb923c", background:"#fb923c20", padding:"2px 5px", borderRadius:3, fontWeight:600}}>⚠ not available</span>}
              </div>
            );
          })}
        </div>

        {/* Equipment clash warning (shown after manual reorder) */}
        {(()=>{
          const clashes = validateSharedKit(chosen, numPeople);
          if (!clashes.length) return null;
          return (
            <div style={{background:"#2d1500", border:"1px solid #f87171", borderRadius:10, padding:"12px 14px", marginBottom:16}}>
              <div style={{fontSize:11, color:"#fc8181", fontWeight:700, marginBottom:6}}>⚠ Equipment clash in this order</div>
              {clashes.map((m,i)=><div key={i} style={{fontSize:11, color:"#feb2b2", marginBottom:2}}>{m}</div>)}
              <button onClick={()=>setChosen(prev=>optimiseCircuit(prev, numPeople))}
                style={{marginTop:10, background:"#1e3a2e", border:"1px solid #4ade8066", borderRadius:8, color:"#4ade80", fontSize:12, fontWeight:700, padding:"8px 14px", fontFamily:"'DM Mono',monospace", cursor:"pointer", letterSpacing:"0.08em"}}>
                ✦ Fix order
              </button>
            </div>
          );
        })()}

        {/* Draggable exercise list */}
        <div style={{display:"flex", flexDirection:"column", gap:0}}>
          {chosen.map((ex,i)=>{
            const tc = TYPE_COLORS[ex.type]||TYPE_COLORS.strength;
            const isDragging = dragIdx === i;
            const isTarget   = dragIdx !== null && dragOverIdx === i && dragOverIdx !== dragIdx;

            const handleDown = (e) => {
              e.preventDefault();
              e.currentTarget.setPointerCapture(e.pointerId);
              setDragIdx(i);
              setDragOverIdx(i);
            };
            const handleMove = (e) => {
              if (dragIdx === null) return;
              const y = e.clientY;
              const rows = previewRowsRef.current;
              let target = rows.length - 1;
              for (let j = 0; j < rows.length; j++) {
                if (!rows[j]) continue;
                const rect = rows[j].getBoundingClientRect();
                if (y < rect.top + rect.height / 2) { target = j; break; }
              }
              setDragOverIdx(target);
            };
            const handleUp = () => {
              if (dragIdx !== null && dragOverIdx !== null && dragIdx !== dragOverIdx) {
                setChosen(prev => {
                  const next = [...prev];
                  const [moved] = next.splice(dragIdx, 1);
                  next.splice(dragOverIdx, 0, moved);
                  return next;
                });
              }
              setDragIdx(null);
              setDragOverIdx(null);
            };

            return (
              <div key={ex.id} ref={el=>previewRowsRef.current[i]=el}
                style={{paddingTop: isTarget && dragOverIdx < dragIdx ? 6 : 0,
                        paddingBottom: isTarget && dragOverIdx > dragIdx ? 6 : 0}}>
                {/* Drop indicator above */}
                {isTarget && dragOverIdx < dragIdx && (
                  <div style={{height:3, borderRadius:2, background:"#4ade80", marginBottom:3}}/>
                )}
                <div style={{display:"flex", alignItems:"center", gap:0,
                  background: isDragging ? "#0a1020" : "#111825",
                  border:`1px solid ${isDragging?"#4ade8055":"#1e2a3a"}`,
                  borderRadius:12, overflow:"hidden", marginBottom:6,
                  opacity: isDragging ? 0.5 : 1,
                  transition:"opacity 0.15s, background 0.15s"}}>
                  {/* Drag handle */}
                  <div
                    onPointerDown={handleDown}
                    onPointerMove={handleMove}
                    onPointerUp={handleUp}
                    onPointerCancel={handleUp}
                    style={{padding:"0 14px", alignSelf:"stretch", display:"flex", alignItems:"center",
                      cursor:"grab", touchAction:"none", color:"#3d4a60", fontSize:16, flexShrink:0,
                      borderRight:"1px solid #1e2a3a", userSelect:"none", WebkitUserSelect:"none"}}>
                    ⠿
                  </div>
                  {/* Number */}
                  <div style={{fontSize:12, fontWeight:700, color:"#3d4a60", minWidth:28, textAlign:"right",
                    fontFamily:"'DM Mono',monospace", padding:"14px 8px 14px 12px", flexShrink:0}}>{String(i+1).padStart(2,"0")}</div>
                  {/* Type accent bar */}
                  <div style={{width:3, alignSelf:"stretch", background:tc.accent, flexShrink:0}}/>
                  {/* Name + equipment */}
                  <div style={{flex:1, minWidth:0, padding:"14px 12px"}}>
                    <div style={{fontSize:18, fontWeight:700, color:"#f7fafc", lineHeight:1.2,
                      fontFamily:"Georgia,serif", marginBottom:4}}>{ex.name}</div>
                    <div style={{display:"flex", alignItems:"center", gap:6}}>
                      <span style={{fontSize:11, color:tc.accent, background:`${tc.accent}20`,
                        padding:"2px 7px", borderRadius:4, fontWeight:600, letterSpacing:"0.06em"}}>{tc.label}</span>
                      <span style={{fontSize:12, color:"#718096"}}>{ex.equipment}</span>
                    </div>
                  </div>
                  {/* Info button */}
                  <button onClick={()=>setPreviewPopup(ex)} style={{
                    background:"#1a2035", border:"none", borderLeft:"1px solid #1e2a3a",
                    color:"#60a5fa", fontSize:13, fontWeight:700, padding:"0 14px",
                    fontFamily:"'DM Mono',monospace", cursor:"pointer", flexShrink:0,
                    alignSelf:"stretch", lineHeight:1
                  }}>ℹ</button>
                </div>
                {/* Drop indicator below */}
                {isTarget && dragOverIdx > dragIdx && (
                  <div style={{height:3, borderRadius:2, background:"#4ade80", marginTop:-3, marginBottom:3}}/>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Info popup modal */}
      {previewPopup && (
        <div onClick={()=>setPreviewPopup(null)} style={{position:"fixed", inset:0, zIndex:100,
          background:"rgba(0,0,0,0.75)", display:"flex", alignItems:"center", justifyContent:"center",
          padding:20, boxSizing:"border-box"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#141c2b", border:"1px solid #2d3a50",
            borderRadius:18, maxWidth:480, width:"100%", overflow:"hidden", maxHeight:"85vh",
            display:"flex", flexDirection:"column"}}>
            {previewPopup.gif && (
              <div style={{width:"100%", height:200, background:"#0d1525", flexShrink:0, overflow:"hidden"}}>
                <img src={previewPopup.gif} alt={previewPopup.name}
                  style={{width:"100%", height:"100%", objectFit:"cover", opacity:0.9}}/>
              </div>
            )}
            <div style={{padding:"20px 22px 24px", overflowY:"auto"}}>
              <div style={{fontSize:22, fontWeight:700, color:"#f7fafc", fontFamily:"Georgia,serif",
                marginBottom:6}}>{previewPopup.name}</div>
              <div style={{fontSize:12, color:"#718096", marginBottom:14}}>{previewPopup.equipment} · {previewPopup.muscles}</div>
              <div style={{fontSize:14, color:"#cbd5e0", lineHeight:1.75,
                borderLeft:"3px solid #4ade8077", paddingLeft:14}}>{previewPopup.cues}</div>
            </div>
            <div style={{padding:"0 22px 22px", flexShrink:0}}>
              <button onClick={()=>setPreviewPopup(null)} style={{...S.btnSec, width:"100%", textAlign:"center"}}>
                Close
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Pinned start button */}
      <div style={{position:"fixed", bottom:0, left:0, right:0, padding:"14px 20px 28px",
        background:"linear-gradient(to bottom, transparent, #0d0f12 40%)", zIndex:10}}>
        <button onClick={startSession} style={S.btnPri}>▶  Start Session</button>
      </div>
    </div>
  );

  // ── COUNTDOWN ────────────────────────────────────────────────────────
  if (screen==="countdown") {
    const circ30 = 2*Math.PI*80;
    const dash30 = circ30 - (countdownSec/30)*circ30;
    const urgent = countdownSec <= 10;
    return (
      <div style={{height:"100vh", background:"#0d0f12", display:"flex", flexDirection:"column",
        alignItems:"center", justifyContent:"center", fontFamily:"'DM Mono','Courier New',monospace",
        position:"relative", overflow:"hidden"}}>
        {/* Ambient pulse */}
        <div style={{position:"fixed", inset:0, zIndex:0,
          background:`radial-gradient(ellipse at 50% 40%, ${urgent?"#1a0a00":"#0a1a0a"} 0%, #0d0f12 60%)`,
          transition:"background 1s ease", pointerEvents:"none"}}/>
        <div style={{position:"relative", zIndex:1, display:"flex", flexDirection:"column",
          alignItems:"center", gap:0}}>
          {/* Main message */}
          <div style={{fontSize:40, fontWeight:700, fontFamily:"Georgia,serif", color:"#f7fafc",
            lineHeight:1.15, textAlign:"center", marginBottom:32}}>
            Circuit 1<br/>starts in
          </div>
          {/* Ring + number */}
          <div style={{position:"relative", width:180, height:180, marginBottom:36}}>
            <svg width="180" height="180" style={{transform:"rotate(-90deg)"}}>
              <circle cx="90" cy="90" r="80" fill="none" stroke="#1e2a3a" strokeWidth="6"/>
              <circle cx="90" cy="90" r="80" fill="none"
                stroke={urgent?"#f87171":"#4ade80"} strokeWidth="6"
                strokeDasharray={circ30} strokeDashoffset={dash30} strokeLinecap="round"
                style={{transition:"stroke-dashoffset 1s linear, stroke 0.5s"}}/>
            </svg>
            <div style={{position:"absolute", inset:0, display:"flex", alignItems:"center",
              justifyContent:"center"}}>
              <span style={{fontSize:72, fontWeight:700, lineHeight:1,
                color:urgent?"#f87171":"#4ade80", fontFamily:"'DM Mono',monospace",
                transition:"color 0.5s"}}>{countdownSec}</span>
            </div>
          </div>
          {/* First exercise per participant */}
          <div style={{width:"100%", maxWidth:500, marginTop:32, display:"flex", flexDirection:"column", gap:8, padding:"0 16px", boxSizing:"border-box"}}>
            {Array.from({length:numPeople},(_,i)=>{
              const cdSeq = seqRef.current;
              const cdCore = cdSeq.length;
              const firstIdx = cdCore > 0 ? ((numPeople-1-i) % cdCore) : -1;
              const ex = firstIdx >= 0 ? cdSeq[firstIdx] : null;
              const tc = ex ? (TYPE_COLORS[ex.type]||TYPE_COLORS.strength) : TYPE_COLORS.strength;
              return (
                <div key={i} style={{display:"flex", alignItems:"center", gap:0,
                  background:"#111825", border:`1px solid #1e2a3a`,
                  borderRadius:12, overflow:"hidden"}}>
                  {/* Colour stripe */}
                  <div style={{width:5, alignSelf:"stretch", background:PERSON_COLORS[i], flexShrink:0}}/>
                  <div style={{flex:1, display:"flex", alignItems:"center", gap:14, padding:"12px 16px", minWidth:0}}>
                    {/* Name */}
                    <div style={{fontSize:13, fontWeight:700, color:PERSON_COLORS[i],
                      letterSpacing:"0.12em", textTransform:"uppercase",
                      minWidth:64, flexShrink:0}}>{names[i]||`P${i+1}`}</div>
                    <div style={{width:1, height:28, background:"#2d3a50", flexShrink:0}}/>
                    {/* Exercise */}
                    {ex ? (
                      <div style={{flex:1, minWidth:0}}>
                        <div style={{fontSize:16, fontWeight:700, color:"#f7fafc", lineHeight:1.2,
                          fontFamily:"Georgia,serif", whiteSpace:"nowrap", overflow:"hidden",
                          textOverflow:"ellipsis"}}>{ex.name}</div>
                        <div style={{display:"flex", alignItems:"center", gap:6, marginTop:3}}>
                          <span style={{fontSize:10, color:tc.accent, background:`${tc.accent}20`,
                            padding:"1px 6px", borderRadius:3, fontWeight:600,
                            letterSpacing:"0.06em"}}>{tc.label}</span>
                          <span style={{fontSize:11, color:"#718096"}}>{ex.equipment}</span>
                        </div>
                      </div>
                    ) : (
                      <div style={{fontSize:13, color:"#4a5568"}}>—</div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
          {/* Skip */}
          <button onClick={()=>{ setCountdownSec(0); }}
            style={{marginTop:28, ...S.btnSec, fontSize:11, padding:"8px 20px", color:"#4a5568",
              borderColor:"#2d3a50"}}>
            Skip →
          </button>
        </div>
      </div>
    );
  }

  // ── DONE ─────────────────────────────────────────────────────────────
  if (screen==="done") return (
    <div style={{...S.page, justifyContent:"center", textAlign:"center", minHeight:"100vh"}}>
      <div style={{fontSize:64, marginBottom:20}}>🏆</div>

  // ── ACTIVE ────────────────────────────────────────────────────────────
  const people = Array.from({length:numPeople},(_,i)=>{

        </div>
      </div>
      <div style={{position:"relative", zIndex:1, margin:"6px 18px 0", height:2, background:"#1e2a3a", borderRadius:2, overflow:"hidden", flexShrink:0}}>
        <div style={{height:"100%", width:`${progPct}%`, background:isResting?"#4ade80":mType.accent, transition:"width 1s linear, background 0.5s"}}/>
      </div>
      <div style={{position:"relative", zIndex:1, display:"flex", justifyContent:"space-between", padding:"3px 18px 0", fontSize:9, color:"#2d3a50", flexShrink:0}}>
        <span>SLOT {Math.max(1,masterIdx-(numPeople-1)+1)}/{Math.max(1,totalSlots-(numPeople-1))}</span><span>{Math.round(progPct)}%</span>
      </div>

      {/* ── TIMER — full width centred on mobile ── */}
      <div style={{position:"relative", zIndex:1, display:"flex", flexDirection:"column", alignItems:"center", paddingTop:10, flexShrink:0}}>
        {/* Circuit label */}
        {(()=>{
          const p1slot = people[0]?.slot;
          const currentCircuit = p1slot?.circuit ?? 1;
          return (
            <div style={{fontSize:16, fontWeight:700, color:"#4ade80", letterSpacing:"0.06em",
              marginBottom:10, fontFamily:"'DM Mono',monospace"}}>
              Circuit {currentCircuit} of {activeCircuits}
            </div>
          );
        })()}
        <div style={{position:"relative", width:130, height:130}}>
          <svg width="130" height="130" style={{transform:"rotate(-90deg)"}}>
            <circle cx="65" cy="65" r="54" fill="none" stroke="#1e2a3a" strokeWidth="5"/>
            <circle cx="65" cy="65" r="54" fill="none" stroke={ringColor} strokeWidth="5"
              strokeDasharray={circ} strokeDashoffset={dash} strokeLinecap="round"
              style={{transition:"stroke-dashoffset 1s linear, stroke 0.3s"}}/>
          </svg>
          <div style={{position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center"}}>
            <div style={{fontSize:42, fontWeight:700, lineHeight:1, color:ringColor, transition:"color 0.3s", fontFamily:"'DM Mono',monospace"}}>{timeLeft}</div>
            <div style={{fontSize:10, color:"#718096", letterSpacing:"0.12em", marginTop:4, fontWeight:600}}>
              {paused?"PAUSED":isResting?"REST":isCD?"FINISH":"GO"}
            </div>
          </div>
        </div>

        {/* Rest label below ring */}
        {isResting && (
          <div style={{fontSize:22, fontWeight:700, fontFamily:"Georgia,serif", color:"#4ade80",
            marginTop:12, letterSpacing:"0.02em"}}>
            Rest
          </div>
        )}
      </div>

      {/* ── PARTICIPANT TILES — scrollable grid below timer ── */}
      <div style={{position:"relative", zIndex:1, flex:1, overflowY:"auto", padding:"10px 14px 0", minHeight:0}}>
        {focusPerson!==null&&focusData ? (
          <div style={{paddingBottom:8}}>
            <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:12}}>
              <button onClick={()=>setFocusPerson(null)} style={{...S.btnSec, padding:"7px 14px", fontSize:11}}>← All</button>
              <div style={{fontSize:14, color:"#e2e8f0", fontWeight:600}}>{focusData.name}</div>
            </div>
            {focusData.slot
              ? <PersonCard slot={focusData.slot} color={focusData.color} large isResting={isResting}/>
              : <div style={{...S.card, textAlign:"center", color:"#718096", fontSize:14, padding:"32px"}}>Session complete</div>
            }
          </div>
        ):(
          <div>
          {isResting&&(
            <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:12, padding:"8px 4px"}}>
              <div style={{flex:1, height:1, background:"#4ade8033"}}/>
              <div style={{fontSize:13, fontWeight:700, letterSpacing:"0.2em", color:"#4ade80"}}>▼ UP NEXT</div>
              <div style={{flex:1, height:1, background:"#4ade8033"}}/>
            </div>
          )}
          <div style={{display:"flex", flexDirection:"column", gap:8, paddingBottom:8}}>
            {people.map((p,i)=>(
              <button key={i} onClick={()=>setFocusPerson(i)} style={{
                display:"flex", alignItems:"center", gap:0,
                background: p.slot ? "#111825" : "#0a0f18",
                border:`1px solid ${p.slot ? "#1e2a3a" : "#141c28"}`,
                borderRadius:14, overflow:"hidden", cursor:"pointer", textAlign:"left",
                opacity: p.slot ? 1 : 0.45, transition:"opacity 0.3s"
              }}>
                {/* Colour stripe */}
                <div style={{width:5, alignSelf:"stretch", background:p.color, flexShrink:0}}/>
                {/* Content */}
                <div style={{flex:1, display:"flex", alignItems:"center", gap:16, padding:"14px 18px", minWidth:0}}>
                  {/* Name */}
                  <div style={{fontSize:17, fontWeight:700, color:p.color, letterSpacing:"0.12em",
                    textTransform:"uppercase", minWidth:72, flexShrink:0}}>{p.name}</div>
                  {/* Divider */}
                  <div style={{width:1, height:36, background:"#2d3a50", flexShrink:0}}/>
                  {/* Exercise info */}
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{fontSize:22, fontWeight:700, color:"#f7fafc", lineHeight:1.2,
                      fontFamily:"Georgia,serif", whiteSpace:"nowrap", overflow:"hidden",
                      textOverflow:"ellipsis"}}>{p.slot ? (p.slot.label||p.slot.name) : "Done"}</div>
                    {p.slot && (
                      <div style={{display:"flex", alignItems:"center", gap:6, marginTop:4}}>
                        <div style={{fontSize:13, color:"#718096"}}>{p.slot.equipment}</div>
                      </div>

                </div>
              </button>
            ))}
          </div>
          </div>
        )}
      </div>

      {/* ── FOOTER — pinned, always visible ── */}
      <div style={{position:"relative", zIndex:2, display:"flex", gap:10, padding:"10px 14px 20px", flexShrink:0, background:"linear-gradient(to bottom, transparent, #0d0f12 35%)"}}>
        <button onClick={()=>setPaused(p=>!p)} style={{flex:1, padding:"14px", background:paused?"#4ade80":"#1a2035", color:paused?"#042008":"#a0aec0", border:paused?"none":"1px solid #2d3a50", borderRadius:10, fontSize:13, fontWeight:paused?700:500, fontFamily:"'DM Mono',monospace", letterSpacing:"0.12em", cursor:"pointer", textTransform:"uppercase"}}>
          {paused?"▶ Resume":"⏸ Pause"}
        </button>
        <button onClick={goHome} style={{...S.btnSec, padding:"14px 20px", fontSize:13, color:"#c8d4e0", borderColor:"#3d4a60"}}>
          ⌂ Home
        </button>
      </div>
    </div>
  );
}

// ── Person Card ───────────────────────────────────────────────────────────────
function PersonCard({ slot, color, name, isResting, large, showName }) {
  const [gifErr, setGifErr] = useState(false);
  if (!slot) return (
    <div style={{background:"#111520", border:"1px solid #1e2a3a", borderRadius:12, padding:"18px", opacity:0.5}}>
      <div style={{fontSize:12, color:"#718096"}}>Done</div>
    </div>
  );
  const tc = TYPE_COLORS[slot.type]||TYPE_COLORS.strength;
  return (
    <div style={{background:"#1a2035", border:`1px solid ${isResting?"#1e4a2e":tc.bg==="#0a0a0a"?"#2d3a50":tc.bg}`, borderRadius:large?16:12, overflow:"hidden", height:"100%", boxSizing:"border-box", transition:"border-color 0.4s"}}>

      {/* GIF banner on large card, small thumb on grid */}
      {slot.gif && !gifErr && (
        <div style={{width:"100%", height:large?160:80, background:"#0d1525", overflow:"hidden", position:"relative"}}>
          <img src={slot.gif} alt={slot.name} onError={()=>setGifErr(true)}
            style={{width:"100%", height:"100%", objectFit:"cover", opacity:0.85}}/>
          <div style={{position:"absolute", inset:0, background:"linear-gradient(to bottom, transparent 40%, #1a2035 100%)"}}/>
        </div>
      )}

      <div style={{padding:large?"16px 20px 20px":"12px 14px 14px"}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8, marginBottom:large?10:6}}>
          <div style={{fontSize:large?20:14, fontWeight:700, lineHeight:1.2, fontFamily:"Georgia,serif", color:"#f7fafc"}}>{slot.label||slot.name}</div>
          <div style={{display:"flex", flexDirection:"column", alignItems:"flex-end", gap:4, flexShrink:0}}>
            <div style={{background:`${tc.accent}20`, border:`1px solid ${tc.accent}44`, borderRadius:6, padding:"3px 8px", fontSize:10, color:tc.accent, letterSpacing:"0.06em", textTransform:"uppercase", fontWeight:700}}>
              {tc.label}
            </div>
          </div>
        </div>

        {large&&(<>
          <div style={{fontSize:14, color:"#cbd5e0", lineHeight:1.7, marginBottom:12, borderLeft:`3px solid ${tc.accent}77`, paddingLeft:12}}>{slot.cues}</div>
          <div style={{fontSize:12, color:"#a0aec0", marginBottom:6}}>{slot.muscles}</div>
          <div style={{display:"flex", alignItems:"center", gap:7}}>
            <div style={{fontSize:12, color:"#a0aec0"}}>{slot.equipment}</div>
          </div>
        </>)}

        {!large&&(<>
          <div style={{fontSize:11, color:"#a0aec0", marginBottom:5, fontWeight:500}}>{slot.equipment}</div>
          <div style={{fontSize:11, color:"#8a9bb0", lineHeight:1.5, marginBottom:6}}>{slot.cues?.slice(0,60)}{slot.cues?.length>60?"…":""}</div>
          <div style={{fontSize:10, color:"#60a5fa", fontWeight:600}}>tap to expand ↗</div>
        </>)}
      </div>
    </div>
  );
}

// ── Timing Slider ─────────────────────────────────────────────────────────────
function Slider({ label, value, min, max, step, onChange, accent }) {
  const pct = ((value-min)/(max-min))*100;
  return (
    <div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
        <span style={{fontSize:13, color:"#e2e8f0", letterSpacing:"0.1em", fontWeight:600}}>{label.toUpperCase()}</span>
        <span style={{fontSize:18, fontWeight:700, color:accent, fontFamily:"'DM Mono',monospace"}}>{fmtSec(value)}</span>
      </div>
      <div style={{position:"relative", height:36, display:"flex", alignItems:"center"}}>
        <div style={{position:"absolute", left:0, right:0, height:4, background:"#2d3a50", borderRadius:2}}/>
        <div style={{position:"absolute", left:0, width:`${pct}%`, height:4, background:accent, borderRadius:2}}/>
        <input type="range" min={min} max={max} step={step} value={value} onChange={e=>onChange(Number(e.target.value))}
          style={{position:"absolute", left:0, right:0, width:"100%", opacity:0, height:36, cursor:"pointer", margin:0}}/>
        <div style={{position:"absolute", left:`calc(${pct}% - 11px)`, width:22, height:22, borderRadius:"50%", background:accent, boxShadow:`0 0 10px ${accent}99`, pointerEvents:"none"}}/>
      </div>
      <div style={{display:"flex", justifyContent:"space-between", marginTop:5, fontSize:10, color:"#4a5568"}}>
        <span>{fmtSec(min)}</span><span>{fmtSec(max)}</span>
      </div>
    </div>
  );
}

// ── Admin Screen ──────────────────────────────────────────────────────────────
const EMPTY_EX = { id:"", name:"", equipment:"", shared:null, cues:"", muscles:"", type:"strength", gif:"" };

function AdminScreen({ db, setDb, onBack, initAudio, beep, availEquip, toggleEquip, equipDb, setEquipDb }) {
  const [adminTab,    setAdminTab]   = useState("exercises");
  const [editing,    setEditing]    = useState(null);
  const [form,       setForm]       = useState(EMPTY_EX);
  const [filter,     setFilter]     = useState("all");
  const [search,     setSearch]     = useState("");
  const [deleteId,   setDeleteId]   = useState(null);
  const [addStep,    setAddStep]    = useState("describe");
  const [nlInput,    setNlInput]    = useState("");
  const [llmLoading, setLlmLoading] = useState(false);
  const [llmError,   setLlmError]   = useState("");
  const [preview,    setPreview]    = useState(null);
  const [newEquipName,   setNewEquipName]   = useState("");

  const openNew  = () => { setForm({...EMPTY_EX, id:Date.now().toString(36)}); setNlInput(""); setLlmError(""); setAddStep("describe"); setEditing("new"); };
  const openEdit = ex => { setForm({...ex}); setEditing(ex.id); setAddStep("review"); };
  const cancel   = () => { setEditing(null); setForm(EMPTY_EX); setNlInput(""); setLlmError(""); };
  const save     = () => {
    if (!form.name.trim()) return;
    // Ensure equipment defaults to first item if somehow empty
    const eq = form.equipment || (equipDb[0]?.label ?? "Bodyweight");
    setDb(prev=>editing==="new"?[...prev,{...form,equipment:eq}]:prev.map(e=>e.id===editing?{...form,equipment:eq}:e));
    cancel();
  };

  const fillLlm = async () => {
    if (!nlInput.trim()) return;
    setLlmLoading(true); setLlmError("");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514", max_tokens:1000,
          system:`You are a fitness expert. Given a description of an exercise, return ONLY a JSON object with these fields:
- name: short exercise name
- equipment: one of ${equipDb.map(e=>JSON.stringify(e.label)).join(", ")}
- muscles: e.g. "Quads · Glutes · Core"
- cues: 1-2 sentence coaching instruction
- type: "strength", "cardio", "power", "core", or "mobility"
- gif: leave as empty string ""
No markdown, no explanation, just the JSON object.`,
          messages:[{role:"user",content:nlInput}]
        })
      });
      const data = await res.json();
      const text = (data.content||[]).map(c=>c.text||"").join("");
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      setForm(f=>({...f, ...parsed, id:f.id, gif:parsed.gif||f.gif||""}));
      setAddStep("review");
    } catch(e) {
      setLlmError("Couldn't parse response — fill manually."); setAddStep("review");
    } finally { setLlmLoading(false); }
  };

  const filtered = db.filter(ex=>(filter==="all"||ex.type===filter)&&(!search||ex.name.toLowerCase().includes(search.toLowerCase())||ex.equipment.toLowerCase().includes(search.toLowerCase())));

  const inStyle = {width:"100%", background:"#111825", border:"1px solid #2d3a50", borderRadius:10, padding:"12px 14px", color:"#e8eaed", fontSize:13, fontFamily:"'DM Mono',monospace", outline:"none", boxSizing:"border-box"};

  const addEquipItem = () => {
    const label = newEquipName.trim();
    if (!label) return;
    const newItem = { id: Date.now().toString(36), label, alwaysAvail: false };
    setEquipDb(prev => [...prev, newItem]);
    toggleEquip(newItem.id); // mark as available by default
    setNewEquipName("");
  };

  return (
    <div style={S.page}>
      <div style={{width:"100%", maxWidth:600}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16}}>
          <button onClick={onBack} style={S.btnSec}>← Back</button>
          <div style={{fontSize:11, letterSpacing:"0.2em", color:"#718096", fontWeight:600}}>ADMIN</div>
          {adminTab==="exercises"
            ? <button onClick={openNew} style={{background:"#4ade80", color:"#042008", border:"none", borderRadius:8, fontSize:12, fontWeight:700, padding:"9px 16px", fontFamily:"'DM Mono',monospace", cursor:"pointer"}}>+ ADD</button>
            : <div style={{width:64}}/>
          }
        </div>

        {/* Tab bar */}
        <div style={{display:"flex", gap:6, marginBottom:24}}>
          {[["exercises","Exercises"],["equipment","Equipment"]].map(([t,l])=>(
            <button key={t} onClick={()=>setAdminTab(t)} style={{
              flex:1, padding:"11px", borderRadius:9, fontSize:12, fontWeight:700,
              fontFamily:"'DM Mono',monospace", letterSpacing:"0.1em", cursor:"pointer", textTransform:"uppercase",
              background: adminTab===t ? "#4ade80" : "#1a2035",

              border: adminTab===t ? "none" : "1px solid #2d3a50"

        </div>

        {/* ── EQUIPMENT TAB ── */}
        {adminTab==="equipment" && (
          <div>
            <div style={{...S.h1, fontSize:22, marginBottom:20}}>Equipment</div>
            <div style={{display:"flex", flexDirection:"column", gap:8, marginBottom:28}}>
              {equipDb.map(item => {
                const on = item.alwaysAvail || availEquip.has(item.id);

        )}

        {/* ── EXERCISES TAB ── */}
        {adminTab==="exercises" && (<div>
        <div style={{...S.h1, fontSize:26, marginBottom:20}}>
